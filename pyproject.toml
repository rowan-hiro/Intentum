[project]
name = "agent-backend"
version = "0.1.0"
description = "Agent-ready backend: a semantic, deterministic execution substrate between AI agents and data systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pydantic>=2.7",
    "mcp>=1.2",
]

[project.scripts]
agent-backend-mcp = "agent_backend.mcp.server.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
